# CodeConnect 示例配置文件
# 复制为 .codeconnect.toml 到项目根目录或 ~/.codeconnect/config.toml
#
# 注意：serde 会**静默忽略**不认识的字段，写错字段名不会报错、
# 只会让那条配置毫无作用。改完建议跑一次 `codeconnect status` 确认没有解析告警。

[workspace]
# 索引范围限定：相对于项目根的**子目录**列表。
# 空或 ["."] = 索引整个项目根；否则只遍历列出的子目录。
# 注意这不是「并列多个根」—— 相对路径始终以项目根为基准计算。
roots = ["."]
# 排除模式，**必须是 glob 形式**：写裸目录名（如 "node_modules"）不匹配任何路径，
# 过滤会静默失效。默认值为 node_modules / target / build / dist / .git / vendor。
# 注意：**只作用于文件监控（增量索引），不作用于全量索引**。
excludes = [
    "**/node_modules/**",
    "**/target/**",
    "**/build/**",
    "**/dist/**",
    "**/.git/**",
    "**/vendor/**",
]

[languages]
# 启用的语言（注释掉即禁用对应语言的解析与索引）
rust = true
typescript = true
javascript = true
java = true
# kotlin = true   # 待 tree-sitter grammar 稳定后启用
csharp = true

[index]
# 索引数据目录（相对于项目根目录）
data_dir = ".codeconnect"
# 是否启用增量索引（仅处理变更文件，提升索引速度）
incremental = true

[search]
# 全局默认最大返回结果数（搜索结果上限）
max_results = 100

[complexity]
# 圈复杂度告警阈值（超过会输出警告信息）
warning_threshold = 15
# 圈复杂度错误阈值（超过会标记为质量问题）
error_threshold = 30

# 死代码检测配置（数组格式，每个条目定义一组入口点）
# 注意：入口点写的是**符号名**，不是文件路径；
# 且该配置目前**未被接线**（工具实际只在未传参时硬编码使用 ["main"]）。
[[dead_code]]
entry_points = ["main"]

# 架构规则（数组格式，每条规则定义一个约束检查）
# 四个字段均为必填：name / description / layers / allowed
[[rules]]
name = "no-circular-deps"
description = "检测模块间的循环依赖"
layers = ["domain", "application", "infrastructure"]
allowed = []

[[rules]]
name = "layer-architecture"
description = "分层架构约束（领域层不可依赖基础设施层）"
layers = ["domain", "application", "infrastructure"]
# 允许的依赖方向，格式为 "来源层 -> 目标层"
allowed = [
    "application -> domain",
    "infrastructure -> domain",
    "infrastructure -> application",
]
