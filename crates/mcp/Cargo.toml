[package]
name = "codeconnect-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "MCP 服务器：rmcp 集成、工具注册、JSON Schema"

[dependencies]
codeconnect-core = { path = "../core" }
codeconnect-services = { path = "../services" }
codeconnect-index = { path = "../index" }
codeconnect-parser = { path = "../parser" }
codeconnect-graph = { path = "../graph" }
# 向量语义检索（semantic_search 的真向量实现）——不启用 downloader 特性，
# 下载模型是用户在命令行显式做的事，MCP 服务器不联网
codeconnect-embed = { path = "../embed" }

rmcp.workspace = true
tokio = { workspace = true, features = ["full"] }
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
tracing.workspace = true
anyhow.workspace = true
uuid.workspace = true
